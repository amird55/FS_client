<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>סיימון</title>
    <style>
        body{
            background-color: #befbf9;
        }
        .red{
            background-color: red;
            width: 300px;
            height: 300px;
        }
        .blue{
            background-color: blue;
            width: 300px;
            height: 300px;
            border-radius: 50%;
        }
        .green{
            background-color: green;
            width: 300px;
            height: 300px;
            /*transform: rotate(45deg);*/
            clip-path: polygon(50% 0%, 0% 50%,50% 100% , 100% 50%);
        }
        .yellow{
            background-color: yellow;
            width: 300px;
            height:300px; /* ≈ width * 0.866 for equilateral */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);

        }
        #btn_panel{
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        .smallBtn{
            transform: scale(0.5);
        }
        #game_viewer{
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }
        td{
            width: 30px;
            height: 30px;
            border: 2px solid black;
        }
        table{
            margin: 0 auto;
        }
    </style>
</head>
<body>
<div id="placements"></div>
<div id="game_viewer"></div>
<div id="btn_panel">
    <div onclick="colorPressed('red')"    class="red    smallBtn"></div>
    <div onclick="colorPressed('blue')"   class="blue   smallBtn"></div>
    <div onclick="colorPressed('green')"  class="green  smallBtn"></div>
    <div onclick="colorPressed('yellow')" class="yellow smallBtn"></div>
</div>
<script>
    const game_viewer=document.getElementById("game_viewer");
    let options=[
        {letter:"R",word:"red",tone:""},
        {letter:"B",word:"blue",tone:""},
        {letter:"G",word:"green",tone:""},
        {letter:"Y",word:"yellow",tone:""},
        ];
    let rezef_str="";
    let rezef=[];
    let rezef_index=0;
    
    let colorTime=500;
    let breakTime=200;
    let colorsNum = 5;
    function colorPressed(color){
        let cls="";
        switch(color){
            case "red":     cls="red";      break;
            case "green":   cls="green";    break;
            case "blue":    cls="blue";     break;
            case "yellow":  cls="yellow";   break;
        }
        let destination = document.getElementById("cell_0");
        destination.className=cls;
    }
    function createPlacement(){
        document.getElementById("placements").innerHTML="";
        let tbl=document.createElement("table");
        let tr=document.createElement("tr");
        for (let i=0;i<colorsNum;i++){
            let td=document.createElement("td");
            td.id = `cell_${i}`;
            tr.appendChild(td);
        }
        tbl.appendChild(tr);
        document.getElementById("placements").appendChild(tbl);
    }
    
    function startGame() {
        createPlacement();
        fillRezef();
        colorStep()
    }
    function fillRezef(){
        rezef_str="";
        for (let i=0;i<colorsNum;i++){
            let wordIdx=Math.floor(Math.random()*(options.length));
            rezef.push(options[wordIdx].word);
            rezef_str += options[wordIdx].letter;
        }
        console.log(rezef_str)
    }
    function colorStep(){
        game_viewer.className="";
        game_viewer.classList.add(rezef[rezef_index++]);
        setTimeout(breakStep, colorTime);
    }
    function breakStep(){
        game_viewer.className="";
        if (rezef_index < rezef.length) {
            setTimeout(colorStep, breakTime);
        }
    }

    startGame()
</script>
</body>
</html>
