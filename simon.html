<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>סיימון</title>
    <style>
        body{
            background-color: #befbf9;
        }
        .red{
            background-color: red;
            width: 300px;
            height: 300px;
        }
        .blue{
            background-color: blue;
            width: 300px;
            height: 300px;
            border-radius: 50%;
        }
        .green{
            background-color: green;
            width: 300px;
            height: 300px;
            transform: rotate(45deg);
        }
        .yellow{
            background-color: yellow;
            width: 300px;
            height:261px; /* ≈ width * 0.866 for equilateral */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);

        }
    </style>
</head>
<body>
<div id="game_viewer"></div>
<div id="btn_panel">
    <div class="red"></div>
    <div class="blue"></div>
    <div class="green"></div>
    <div class="yellow"></div>
</div>

</body>
</html>
